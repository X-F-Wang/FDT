train_dataset:
  dataset:
    name: image-folder
    args:
      root_path: /home/DIV2K_train_HR
      #repeat: 10 # 20 for bz 16
      repeat: 40 # 20 for bz 16
      cache: bin
  wrapper:
    name: sr-implicit-downsampled-cascaded
    args:
      inp_size: 48
      batch_size: 32
      #batch_size: 16
      scale_min: [1]
      scale_max: [4]
      sample_q: 2304
      augment: True
      phase: train
      k: 1

  batch_size: 32
  #batch_size: 16

val_dataset:
  dataset:
    name: image-folder
    args:
      root_path: /home/DIV2K_valid_HR
      first_k: 10
      repeat: 40
      cache: bin
  wrapper:
    name: sr-implicit-downsampled-cascaded
    args:
      inp_size: 48
      batch_size: 8
      scale_min: [1]
      scale_max: [4]
      sample_q: 2304
      phase: valid

  batch_size: 8

#eval_type: div2k-4
#eval_bsize: 3000

data_norm:
  inp: {sub: [0.5], div: [0.5]}
  gt: {sub: [0.5], div: [0.5]}

model:
  name: FSlit2m4q
  args:
    base_dim: 256
    head: 8
    r: 3
    imnet_num: 1
    conv_num: 1
    is_cell: True
    local_attn: True

    encoder_spec:
      name: rdn
      args:
        no_upsampling: True

    pb_spec:
      name: posenc
      args:
        posenc_type: 'sinusoid'
        posenc_scale: 10
        hidden_dims: 64
        enc_dims: 64
        gamma: 1

    imnet_spec:
      name: mlp
      args:
        out_dim: 3
        hidden_list: [256,256,256,256]
        act: 'gelu'

optimizer:
  name: adam
  args:
    #lr: 1.e-4
     lr: 1.e-5

epoch_max: 1050

warmup_step_lr:
  multiplier: 10
  total_epoch: 50

#multi_step_lr:
  #milestones: [200, 400, 600, 800]
  #gamma: 0.5

epoch_val: 50
epoch_save: 1050

resume: ~
pre_train: ~